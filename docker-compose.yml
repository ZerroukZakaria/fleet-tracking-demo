services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      # Bound to localhost so the broker is not reachable from the network
      - "127.0.0.1:1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      # Throwaway local-only credentials for the demo
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet_local_only
      POSTGRES_DB: fleet
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ingest:
    build:
      context: .
      args:
        SERVICE: ingest
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      DATABASE_URL: postgres://fleet:fleet_local_only@postgres:5432/fleet
    depends_on:
      mosquitto:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  publisher:
    build:
      context: .
      args:
        SERVICE: publisher
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      SIM_SPEED: ${SIM_SPEED:-10}
    depends_on:
      ingest:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata: